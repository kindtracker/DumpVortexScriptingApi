<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region3 - Roblox API</title>
<style>
:root {
	--bg: #120b1b;
	--fg: #e5e5ea;
	--muted: #656d76;
	--border: #d1d9e0;
	--surface: #f6f8fa;
	--link: #0969da;
}
* { box-sizing: border-box; }
body {
	font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	max-width: 1100px;
	margin: 0 auto;
	padding: 32px 24px 64px;
	line-height: 1.65;
	background: var(--bg);
	color: var(--fg);
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 2rem; overflow-wrap: anywhere; }
h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
h2 { margin-top: 32px; }
code {
	font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
	font-size: 0.92em;
	overflow-wrap: anywhere;
}
details {
	border: 1px solid var(--border);
	border-radius: 8px;
	margin: 14px 0;
	overflow: hidden;
}
summary {
	cursor: pointer;
	font-weight: 650;
	padding: 12px 16px;
	background: var(--surface);
}
details > ul { padding: 4px 20px 12px 40px; }
li { padding: 4px 0; overflow-wrap: anywhere; }
p { overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.tag {
	display: inline-block;
	border: 1px solid var(--border);
	border-radius: 5px;
	padding: 1px 7px;
	margin: 2px;
	font-size: 0.85em;
}

</style>
</head>

</ul>
</details>

</ul>
</details>

</body>
</html>
